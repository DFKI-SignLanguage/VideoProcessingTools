name: run-tests
on: [push]
jobs:
  pytester:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt update && sudo apt install -y ffmpeg libegl1 libgles2
      - run: python -m pip install -r requirements.txt
      - name: Download MediaPipe models
        run: bash models/downloadModels.sh
      - run: python -m pytest
